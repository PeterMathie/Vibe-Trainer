name: Android debug build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Enable emulator hardware acceleration
        run: |
          sudo chown "$USER":kvm /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Verify end-to-end workflow in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            mkdir -p app/build/launch-check
            set +e
            timeout --signal=TERM --kill-after=30s 12m \
              gradle :app:connectedDebugAndroidTest --stacktrace
            test_status=$?
            set -e
            if [ "$test_status" -ne 0 ]; then
              adb devices -l > app/build/launch-check/adb-devices.txt || true
              adb logcat -d -t 2000 > app/build/launch-check/instrumentation-logcat.txt || true
              adb shell dumpsys activity activities > app/build/launch-check/instrumentation-activities.txt || true
              adb shell dumpsys window > app/build/launch-check/instrumentation-window.txt || true
              exit "$test_status"
            fi
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.petermathie.vibecheck/.MainActivity
            sleep 5
            adb shell pidof com.petermathie.vibecheck
            adb shell screencap -p /sdcard/vibe-check-launch.png
            adb pull /sdcard/vibe-check-launch.png app/build/launch-check/home.png
            adb logcat -d -s AndroidRuntime:E > app/build/launch-check/runtime-errors.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe-check-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/schemas/
            app/build/launch-check/
